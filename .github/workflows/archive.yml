name: 每日存檔

on:
  schedule:
    - cron: "40 16 * * *"  # 每天台灣時間 00:40
  workflow_dispatch:        # 也可以在 GitHub → Actions 手動執行

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: 存檔昨天的每日摘要、記下今天的預測
        env:
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
        run: python scripts/archive_daily.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "沒有新資料" && exit 0
          git commit -m "每日存檔 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
