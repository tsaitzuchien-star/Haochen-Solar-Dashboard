name: LINE 通知

on:
  schedule:
    - cron: "*/30 * * * *"  # 每 30 分鐘檢查一次 (GitHub 排程可能延遲幾分鐘)
  workflow_dispatch:
    inputs:
      test:
        description: "傳一則測試訊息"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: 檢查並發送
        env:
          GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          BATT_FLOOR: ${{ vars.BATT_FLOOR }}
        run: python scripts/notify.py ${{ inputs.test && '--test' || '' }}
      - name: 記錄發送狀態
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notify_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "通知紀錄 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
